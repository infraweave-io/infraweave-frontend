# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
# Install: pip install pre-commit && pre-commit install

repos:
  # ── General file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        # pnpm writes the lockfile as two YAML documents (package manager + deps)
        exclude: ^pnpm-lock\.yaml$
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # ── Secret scanning ─────────────────────────────────────────────────────────
  # Requires: brew install gitleaks
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        language: system
        entry: gitleaks protect --staged --config .gitleaks.toml
        pass_filenames: false

  # ── Code formatting (oxfmt) ──────────────────────────────────────────────────
  # Uses the repo-pinned oxfmt from node_modules; config and ignores in .oxfmtrc.json.
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        language: system
        entry: node_modules/.bin/oxfmt
        args: [--no-error-on-unmatched-pattern]
        types_or: [ts, tsx, css, json, yaml, markdown]
        pass_filenames: true

  # ── Linting (oxlint) ─────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        language: system
        entry: node_modules/.bin/oxlint
        args: [--max-warnings=0]
        types_or: [ts, tsx]
        pass_filenames: true
