name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]

permissions:
  id-token: write # for AWS OIDC
  contents: read
  pull-requests: write # to update the preview comment

jobs:
  cleanup-preview:
    name: Remove preview from S3
    runs-on: ubuntu-latest
    # OIDC federation is unavailable to fork PRs — nothing was deployed for them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PREVIEW_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PREVIEW_AWS_REGION }}

      - name: Delete preview objects
        run: aws s3 rm "s3://${{ vars.PREVIEW_S3_BUCKET }}/pr-${PR_NUMBER}/" --recursive

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.PREVIEW_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/pr-${PR_NUMBER}/*"

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            ### 🧹 Preview removed

            The preview for this PR has been torn down.
