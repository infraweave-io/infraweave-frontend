name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # pnpm version comes from "packageManager" in package.json. It must be on
      # PATH before setup-node so `cache: pnpm` can locate the store.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install --upgrade pre-commit

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan secrets
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --verbose

      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # TODO: switch the type check from tsc to oxlint once `--type-check` leaves
      # experimental. Tested with oxlint 1.93.0 + oxlint-tsgolint 7.0.2007: 0 errors
      # (same as tsc), real errors still caught, ~4x faster locally (3.5 s -> 0.8 s).
      # Steps:
      #   1. devDependency: pnpm add -D oxlint-tsgolint (provides the TypeScript-Go checker).
      #   2. tsconfig.json: add "strict": false to compilerOptions. TypeScript 7 defaults
      #      to strict; TS 5.x did not, so this keeps today's behaviour.
      #   3. New .oxlintrc.typecheck.json (type-check only, no lint rules). Its ignores
      #      must mirror tsconfig.json "exclude", or it checks files tsc never does:
      #        { "plugins": [], "categories": { "correctness": "off" },
      #          "ignorePatterns": ["src/standalone/**", "src/dev/**",
      #                             "**/*.test.ts", "**/*.test.tsx"] }
      #   4. package.json "typecheck":
      #        oxlint -c .oxlintrc.typecheck.json --type-aware --type-check src
      #      (src only: root files such as vite.config.mts are outside tsconfig "include").
      #   5. This step stays `pnpm run typecheck`; drop the typescript devDependency only
      #      if nothing else needs it (editors and Vite/Vitest read tsconfig.json).
      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Run Playwright tests
        run: pnpm run test:e2e

      - name: Generate Playwright screenshot PDF
        if: always()
        run: pnpm run test:e2e:screenshots:pdf

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: |
            playwright-screenshots.html
            playwright-screenshots.pdf
          if-no-files-found: ignore
          retention-days: 7
